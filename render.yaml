services:
  - type: web
    name: mindflow-ai
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    disk:
      name: mindflow-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
